<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Увлекательная физика</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .links {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .links a {
            display: block;
            margin: 15px 0;
            padding: 18px 25px;
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s;
            touch-action: manipulation;
            user-select: none;
            box-shadow: 0 4px 10px rgba(0,123,255,0.3);
        }

        .links a:active {
            transform: scale(0.96);
            box-shadow: 0 2px 5px rgba(0,123,255,0.3);
        }

        .links a:hover {
            background: linear-gradient(135deg, #0056b3 0%, #003d82 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,123,255,0.4);
        }

        .links a::before {
            content: "🎮 ";
            margin-right: 8px;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            h1 {
                font-size: 26px;
                margin-bottom: 20px;
            }

            .links {
                padding: 15px;
            }

            .links a {
                padding: 16px 20px;
                font-size: 16px;
                margin: 12px 0;
            }
        }

        @media (max-width: 360px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 22px;
                margin-bottom: 15px;
            }

            .links {
                padding: 12px;
            }

            .links a {
                padding: 14px 15px;
                font-size: 15px;
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>

    <h1>📚 Темы:</h1>

    <div class="links">
        <a href="https://eldar-p.github.io/physics-and-games/friction.html" target="_blank">Трение</a>
        <a href="https://eldar-p.github.io/physics-and-games/strength.html" target="_blank">Сила</a>
        <a href="https://eldar-p.github.io/physics-and-games/inertia.html" target="_blank">Инерция</a>
    </div>

</body>
</html>
